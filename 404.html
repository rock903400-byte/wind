<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 頁面不存在 · Wind 跨產業接案開發</title>
  <meta name="description" content="找不到您要求的頁面，請返回 Wind 作品集首頁或探索 AI 流程賦能服務。">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/tokens.css?v=20260829">
  <style>
    :root {
      --bg: #0a0e1a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    /* 背景裝飾光暈 */
    .glow-blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .card {
      position: relative;
      z-index: 1;
      max-width: 540px;
      width: 100%;
      padding: 56px 36px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .badge-404 {
      font-size: 88px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      letter-spacing: -2px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .btn-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    .brand-footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="glow-blob"></div>
  <main class="card">
    <div class="badge-404">404</div>
    <h1>找不到此頁面</h1>
    <p>您造訪的網址可能已移動、網址有誤或暫時不可用。<br>請點選下方按鈕回到作品集首頁或查看我們的 AI 賦能服務。</p>
    <div class="btn-group">
      <a href="index.html" class="btn btn-primary">
        <span>🌀</span> 返回作品集首頁
      </a>
      <a href="ai-enablement.html" class="btn btn-secondary">
        <span>⚡</span> 飛律 AI 流程賦能
      </a>
    </div>
    <div class="brand-footer">
      Wind × 飛律 · 跨產業接案開發
    </div>
  </main>
</body>
</html>
